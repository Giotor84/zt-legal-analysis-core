[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

norecursedirs = tools _legacy archive venv .git __pycache__

markers =
    unit: Unit test - no external services, no LLM, no filesystem I/O
    integration: Integration test - exercises multiple modules end-to-end
    slow: Tests that take more than 5 seconds
    eval: Eval harness - regressioni golden set + bug-as-test (no LLM)

asyncio_mode = auto
