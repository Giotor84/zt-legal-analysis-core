# Profilo runtime: Amazon Bedrock Managed (produzione)
# Modello: Qwen3 235B-A22B via AWS Bedrock
# Regione: eu-central-1 (EU cross-region inference)
# Credenziali: IAM Role / env AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
# Override variabile d'ambiente: LLM_RUNTIME_PROFILE=bedrock_managed

backend: bedrock
model: "qwen.qwen3-235b-a22b-2507-v1:0"
region: "eu-central-1"
timeout: 1800.0
max_tokens: 12000
temperature: 0.1
proxy: ""    # es. http://proxy.corporate.example.com:3128 se necessario

# Note operative:
# - Extended Thinking Qwen3: passare think=True nelle chiamate generate_structured
# - Quota Bedrock: ~100k token/min su eu-central-1
# - Fallback consigliato: local_ollama.yaml
